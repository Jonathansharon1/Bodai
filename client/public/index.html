<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BodAI - AI Body Language Analyzer and Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Clear Clerk redirect URLs IMMEDIATELY on page load, before React or Clerk initializes
      // This prevents Clerk from redirecting when refreshing pages
      (function() {
        try {
          const pathname = window.location.pathname;
          const isAuthPage = pathname === '/sign-in' || 
                             pathname === '/sign-up' || 
                             pathname.startsWith('/sign-in/') || 
                             pathname.startsWith('/sign-up/');
          
          if (!isAuthPage) {
            // Clear from sessionStorage
            Object.keys(sessionStorage).forEach(function(key) {
              var lowerKey = key.toLowerCase();
              if (lowerKey.indexOf('clerk') !== -1 && 
                  (lowerKey.indexOf('redirect') !== -1 || 
                   lowerKey.indexOf('aftersign') !== -1 ||
                   lowerKey.indexOf('signin') !== -1 ||
                   lowerKey.indexOf('signup') !== -1)) {
                sessionStorage.removeItem(key);
              }
            });
            
            // Clear from localStorage
            Object.keys(localStorage).forEach(function(key) {
              var lowerKey = key.toLowerCase();
              if (lowerKey.indexOf('clerk') !== -1 && 
                  (lowerKey.indexOf('redirect') !== -1 || lowerKey.indexOf('aftersign') !== -1)) {
                localStorage.removeItem(key);
              }
            });
            
            // Clear from URL params
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('__clerk_redirect_url') || urlParams.has('redirect_url')) {
              urlParams.delete('__clerk_redirect_url');
              urlParams.delete('redirect_url');
              var newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
              window.history.replaceState({}, '', newUrl);
            }
          }
        } catch (e) {
          // Ignore errors
        }
      })();
    </script>
  </body>
  </html>
